name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q -rx
      - name: End-to-end run on a sample case
        run: |
          cloudtrace analyze data/fixtures/c01_attack_key_for_other_used_from_creator_source/events.json --out out
          test -s out/report.md
          test -s out/report.json
